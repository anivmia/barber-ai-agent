services:
  - type: web
    name: barber-ai-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: GOOGLE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
